# Canonical defaults for tracker.
#
# This file is loaded first by config.load_config().  An experiment yaml passed
# via --config is deep-merged on top, then tracker/local.yml (if present),
# then --set CLI overrides.  See config/schema.py for the validated types.
#
# To override anything for an experiment, do NOT edit this file.  Add the
# changed keys to an experiments/<name>.yml at the repo root, or to local.yml
# for machine-specific overrides.

camera:
  # int (device index 0/1/...) or string (IP camera URL).  No lab-specific
  # default is shipped; set this in local.yml or via --set if your camera is
  # not the system default device.
  index: 1
  aruco_dict: DICT_4X4_50            # any cv2.aruco.DICT_* name
  corner_marker_size_cm: 15.2
  robot_marker_size_cm: 8.0
  robot_marker_height_cm: 15.0        # marker centre height above floor; parallax-corrects position (0=off)
  calibration_file: null             # path to .npz from calibrate.py
  hfov_deg: 63.0                     # iPhone 8 ≈ 63°, iPhone 16 ≈ 54°
  reconnect: true                    # re-open the stream on read failure instead of crashing (vital for URL streams)
  reconnect_backoff_s: 1.0           # initial reconnect delay; doubles up to 5s
  buffer_size: 1                     # CAP_PROP_BUFFERSIZE; 1 = freshest frame after a stall

tracking:
  loop_rate_hz: 30                    # capture/render loop pacing (Hz)
  heading_smooth_alpha: 0.35
  position_max_speed: 2.0             # grid units/sec; spikes above are rejected
  position_reject_max_frames: 8       # consecutive rejects before accepting a real teleport (0 disables)
  max_pose_reproj_px: 0.9             # reject robot poses with worse marker-quad fit (0 disables)

grid:
  corner_ids: [1, 2, 3, 4]            # exactly 4; TL TR BR BL physically
  robot_marker_id: 0
  cols: 10                            # matches the trained PPO model (10x10)
  rows: 10
  auto_lock: true                     # lock grid automatically when 4 corners visible
  cell_size_m: 0.30                   # physical edge length of one cell (m); analysis-only

bridge:
  enabled: true
  host: TURTLEBOT3-VM                     # set the real bridge host in local.yml
  port: 9090

scene:
  dir: scenes
  default_name: scene

capture:
  dir: captures
  warp_size: 800

orchestrator:
  enabled: false                      # opt-in; doesn't change existing GUI behaviour
  experiments_root: ../experiments    # runs/<run_id>/ folders land here
  research_project_root: null         # optional local clone; metadata git_sha fallback
  warmup_count: 5
  warmup_timeout_s: 10.0
  bag_max_duration_s: 300
  run_max_duration_s: 240             # backstop in case auto_driver wedges in WAITING_GOAL
  cleanup_remote_after_pull: false    # leave bags on the Pi for manual recovery; flip to true once the pipeline is stable
  ppo_goal_assist: false              # PPO only: when robot is 8-adjacent to goal, predict is still logged but the final step is driven onto the goal cell (assisted finish flagged in metadata)
  voltage_band_v: [11.8, 12.6]
  summarize_after_run: true           # spawn summarize_run as a background subprocess
  summarize_python: null              # absolute path to analysis venv python; null = skip
  summarize_script: ../analysis/summarize_run.py
  ssh_mock: false                     # local fake (no real SSH/scp) for end-to-end tests
  ssh:
    connect_timeout_s: 10
    max_retries: 3
    pi:
      target: robot                   # `~/.ssh/config` alias resolving to ubuntu@<pi>
      bag_script: /home/ubuntu/ppo-tb3-research-project/robot/scripts/tb3_bag_record.sh
      remote_tmp: /tmp/experiments
    desktop:
      target: vm                      # `~/.ssh/config` alias resolving to ubuntu@<vm>
      bag_script: /home/ubuntu/ppo-tb3-research-project/robot/scripts/tb3_bag_record.sh
      remote_tmp: /tmp/experiments

auto:
  log_dir: auto_logs
  log_maps: true                      # include obstacle_map + energy_map in JSONL
  max_illegal_retries: 3
  predict_cooldown_s: 0.25
  predict_timeout_s: 5.0
  goal_timeout_s: 60.0                # WAITING_GOAL backstop (handover §13)
  warp_size: 800
  experiment_tag: ""                  # appended to log filenames if non-empty
  blocking_layers: [obstacles]        # scene layers that block movement
  settle:
    speed_threshold: 0.10             # grid-units/s; below = settled
    angular_threshold_deg_per_s: 5.0
    min_duration_s: 0.5               # require all three signals stable this long
    timeout_s: 5.0                    # proceed anyway after this much waiting
    freshness_window_s: 0.5           # frame-signature must change within this window
  minimap_enabled: true               # top-right HUD minimap during auto runs
  minimap_cell_px: 36

ui:
  show_preview: true
  reference_height: 1080              # baseline frame height for UI scaling
  scale_multiplier: 1.0               # +/-/0 keys adjust at runtime; this is the start
  theme:
    # Colours are BGR.  All defaults mirror DEFAULT_THEME at overlay.py:113-156.
    col_grid: [200, 200, 200]
    col_grid_border: [255, 255, 255]
    col_cell_ok: [0, 255, 128]
    col_cell_oob: [0, 0, 255]
    col_arrow: [0, 0, 255]
    col_hud_text: [255, 255, 255]
    col_hud_bg: [0, 0, 0]
    col_label: [220, 220, 220]
    col_target: [255, 180, 0]
    col_hint: [255, 255, 255]
    col_hint_shadow: [0, 0, 0]
    col_marker: [0, 255, 0]
    col_marker_id: [0, 255, 0]
    font: 0                           # cv2.FONT_HERSHEY_SIMPLEX
    grid_thick_inner: 1
    grid_thick_outer: 2
    arrow_thick: 2
    hint_outline_thick: 3
    hud_text_thick: 1
    marker_thick: 2
    hud_scale: 0.55
    label_scale: 0.35
    hint_scale: 0.5
    marker_id_scale: 0.5
    hud_line_h: 24
    hud_pad: 8
    hud_char_w: 10
    label_offset: [-10, 5]
    hint_offset: [-6, 6]
    cell_alpha: 0.3
    hud_bg_alpha: 0.6
    arrow_len: 0.4
    arrow_tip: 0.3
    col_minimap_bg: [0, 0, 0]
    col_minimap_grid: [80, 80, 80]
    col_minimap_obstacle: [60, 60, 220]
    col_minimap_action_legal: [220, 220, 0]
    col_minimap_action_illegal: [60, 60, 220]
    col_minimap_text: [230, 230, 230]
    col_minimap_title: [180, 220, 220]
    col_minimap_robot: [0, 255, 128]
    col_minimap_goal: [220, 0, 200]
